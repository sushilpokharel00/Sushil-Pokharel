name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install dependencies
        run: npm ci
      - name: Build Android app download
        run: |
          npm run android:sync
          cd android
          bash gradlew assembleDebug
          cd ..
          mkdir -p "$RUNNER_TEMP/android-download"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/android-download/Sushil-Pokharel.apk"
      - name: Build website
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://afbyphuozsdsajzngndq.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_X_XnP6cOHNY6mHAA5s7kDw_BrIhqxqF' }}
        run: |
          npm run build
          cp dist/app.html dist/index.html
          cp dist/index.html dist/404.html
          if [ -f CNAME ]; then cp CNAME dist/CNAME; fi
          git rm -r --ignore-unmatch assets
          mkdir -p assets
          cp -R dist/assets/. assets/
          cp dist/index.html index.html
          cp dist/404.html 404.html
          git add index.html assets
          git add 404.html favicon.ico favicon.svg CNAME
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Publish built website"
            git push
          fi
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-download >/dev/null 2>&1; then
            gh release upload android-download "$RUNNER_TEMP/android-download/Sushil-Pokharel.apk" --clobber
          else
            gh release create android-download "$RUNNER_TEMP/android-download/Sushil-Pokharel.apk" \
              --title "Android app download" \
              --notes "Download the latest Android APK for Sushil Pokharel. The app loads the live website." \
              --target "$GITHUB_SHA"
          fi
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
